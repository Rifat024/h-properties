<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf3ec"/><stop offset="1" stop-color="#cfe4d6"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#s)"/>
  <!-- building under construction -->
  <rect x="180" y="150" width="330" height="420" fill="#e7efe9"/>
  <rect x="180" y="150" width="330" height="420" fill="none" stroke="#bcd3c3" stroke-width="2"/>
  <g fill="#12643a" opacity="0.8">
    <rect x="210" y="185" width="60" height="48"/><rect x="290" y="185" width="60" height="48"/><rect x="370" y="185" width="60" height="48"/><rect x="450" y="185" width="40" height="48"/>
