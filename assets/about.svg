    <line x1="220" y1="110" x2="220" y2="150"/><line x1="280" y1="110" x2="280" y2="150"/><line x1="340" y1="110" x2="340" y2="150"/><line x1="400" y1="110" x2="400" y2="150"/><line x1="460" y1="110" x2="460" y2="150"/>
