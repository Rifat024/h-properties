  <line x1="430" y1="90" x2="430" y2="200" stroke="#d99a3f" stroke-width="4"/>
  <rect x="410" y="200" width="40" height="26" fill="#d99a3f"/>
  <rect x="120" y="560" width="620" height="40" fill="#0f5c33"/>
