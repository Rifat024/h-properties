    <line x1="600" y1="90" x2="380" y2="90"/>
    <line x1="600" y1="90" x2="700" y2="90"/>
    <line x1="600" y1="80" x2="440" y2="90"/>
    <line x1="600" y1="80" x2="680" y2="90"/>
