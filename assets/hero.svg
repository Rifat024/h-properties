    <rect x="670" y="510" width="55" height="42" rx="3"/><rect x="745" y="510" width="55" height="42" rx="3"/><rect x="820" y="510" width="55" height="42" rx="3"/><rect x="895" y="510" width="35" height="42" rx="3"/>
