    <rect x="495" y="540" width="45" height="40" rx="3"/><rect x="560" y="540" width="45" height="40" rx="3"/>
    <rect x="495" y="610" width="45" height="40" rx="3"/><rect x="560" y="610" width="45" height="40" rx="3"/>
    <rect x="495" y="680" width="45" height="40" rx="3"/><rect x="560" y="680" width="45" height="40" rx="3"/>
