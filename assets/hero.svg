<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d22"/>
      <stop offset="0.55" stop-color="#12643a"/>
      <stop offset="1" stop-color="#1c7a48"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ef"/>
      <stop offset="1" stop-color="#cfe0d4"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeee3"/>
      <stop offset="1" stop-color="#b9d3c1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1230" cy="210" r="120" fill="#d99a3f" opacity="0.35"/>
  <circle cx="1230" cy="210" r="80" fill="#f0c27b" opacity="0.4"/>
  <!-- back buildings -->
  <g opacity="0.5" fill="#0d4a29">
    <rect x="120" y="430" width="150" height="470"/>
    <rect x="300" y="360" width="120" height="540"/>
    <rect x="1180" y="400" width="160" height="500"/>
    <rect x="1380" y="330" width="140" height="570"/>
  </g>
  <!-- main tower -->
